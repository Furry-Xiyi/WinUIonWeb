<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="lib/fluent.css">
  <style>
    body { max-width: 600px; margin: 40px auto; padding: 24px; }
    .header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
    .header img { width: 48px; height: 48px; }
    .title { font-size: 24px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="icon">
    <div class="title" id="extName">Xiyi Download</div>
  </div>
  <div class="card">
    <div class="row">
      <div class="col"><span class="label" id="lblEnabled">Enable</span></div>
      <label class="switch">
        <input type="checkbox" id="chkEnabled">
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <div class="card">
    <div class="row">
      <div class="col" style="flex:1;">
        <span class="label" id="lblSize">Size</span>
        <span class="desc" id="lblDesc">Desc</span>
      </div>
      <input type="number" id="minSize" min="0" step="0.1">
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
